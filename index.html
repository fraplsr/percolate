<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Percolate</title>
<meta name="description" content="Official support and legal pages for Percolate, the business tycoon game for Android.">
<meta name="theme-color" content="#3a2a22">
<link rel="icon" type="image/png" href="privacy/assets/favicon.png">
<link rel="apple-touch-icon" href="privacy/assets/apple-touch-icon.png">
<style>
:root{color-scheme:light;--ink:#2f231d;--paper:#f6efe3;--cup:#c96d45;--sleeve:#7d8a4f;--brown:#3a2a22}
*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 0,#fffaf1 0,var(--paper) 52%,#ece2d2 100%);color:var(--ink);font:17px/1.6 Inter,ui-sans-serif,system-ui,sans-serif}
main{width:min(100%,760px);overflow:hidden;text-align:center;background:#fffdf8;border:1px solid rgba(58,42,34,.12);border-radius:28px;box-shadow:0 28px 70px rgba(58,42,34,.12)}
.hero{display:block;width:100%;height:auto;aspect-ratio:1024/500}
.body{padding:clamp(24px,6vw,48px)}
.brand{display:flex;align-items:center;justify-content:center;gap:16px}.brand img{width:72px;height:72px;border-radius:22%;box-shadow:0 10px 24px rgba(58,42,34,.2)}
.word{font-weight:800;font-size:clamp(26px,5vw,38px);letter-spacing:.32em;margin-right:-.32em;color:var(--brown)}
.intro{max-width:520px;margin:18px auto 26px;color:#5d5048}
.button{display:inline-block;padding:14px 22px;border-radius:14px;background:var(--brown);color:#fff;text-decoration:none;font-weight:750}.button:hover{background:#56402f}
.mail{margin-top:18px;font-size:15px}.mail a{color:#a24f2c;font-weight:650}
</style>
</head>
<body>
<main>
  <img class="hero" src="privacy/assets/banner.webp" width="1024" height="500" alt="Percolate: a city map from the game">
  <div class="body">
    <div class="brand"><img src="privacy/assets/icon.webp" width="192" height="192" alt="Percolate icon"><span class="word">PERCOLATE</span></div>
    <p class="intro">A business tycoon for Android: open cafés, shops and hotels in 10 real cities and grow them into an empire.</p>
    <a class="button" href="privacy/">Privacy policy &amp; support</a>
    <p class="mail">Support: <a href="mailto:percolategame@gmail.com">percolategame@gmail.com</a></p>
  </div>
</main>
</body>
</html>
