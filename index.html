<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Percolate</title>
<meta name="description" content="Official support and legal pages for Percolate, the coffee-chain tycoon by fraplsr.">
<meta name="theme-color" content="#24372f">
<link rel="icon" type="image/png" href="privacy/assets/favicon.png">
<style>
:root{color-scheme:light;--ink:#24372f;--paper:#f5f1e8;--sage:#7f8952;--clay:#c66c48}
*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 0,#fffaf0 0,var(--paper) 52%,#e9e0d1 100%);color:var(--ink);font:17px/1.6 Inter,ui-sans-serif,system-ui,sans-serif}
main{width:min(100%,760px);padding:clamp(32px,7vw,70px);text-align:center;background:#fffdf7;border:1px solid rgba(67,45,36,.14);border-radius:30px;box-shadow:0 28px 70px rgba(67,45,36,.12)}
img{width:min(100%,480px);height:auto}.tag{margin:22px 0 10px;color:#5e6a49;font-size:13px;font-weight:800;letter-spacing:.15em}.intro{max-width:540px;margin:0 auto 28px;color:#53645c}.button{display:inline-block;padding:14px 21px;border-radius:14px;background:var(--ink);color:#fff;text-decoration:none;font-weight:750}.button:hover{background:#315345}.rule{width:64px;height:5px;margin:30px auto;border-radius:9px;background:linear-gradient(90deg,var(--sage),var(--clay))}
</style>
<main>
  <img src="privacy/assets/percolate-logo.webp" width="1024" height="480" alt="Percolate">
  <div class="rule"></div>
  <p class="tag">OFFICIAL · FRAPLSR</p>
  <p class="intro">An original coffee-chain tycoon currently in development for Android.</p>
  <a class="button" href="privacy/">Privacy policy &amp; support</a>
</main>
</html>
